<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayfare — travel expense ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy: #14213D;
    --navy-deep: #0E1830;
    --cream: #F4EFE1;
    --cream-dim: #E8E0CC;
    --ink: #1C2B4A;
    --gold: #C99A2E;
    --gold-bright: #E0B646;
    --rust: #A8452F;
    --sage: #6B8763;
    --line: rgba(28,43,74,0.14);
    --line-on-navy: rgba(244,239,225,0.16);
    --shadow: 0 18px 40px rgba(14,24,48,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--navy);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(201,154,46,0.10), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(107,135,99,0.10), transparent 45%);
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--cream);
    min-height: 100vh;
  }
  .app{
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ---------- Header ---------- */
  .hero{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom: 34px;
    border-bottom: 1px solid var(--line-on-navy);
    padding-bottom: 22px;
    flex-wrap: wrap;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size: 2.4rem;
    margin:0 0 6px;
    letter-spacing: -0.01em;
  }
  .hero p{
    margin:0;
    color: rgba(244,239,225,0.62);
    font-size: 0.95rem;
    max-width: 40ch;
  }
  .trip-picker{
    display:flex;
    gap:10px;
    align-items:center;
  }
  select.trip-select{
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--line-on-navy);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.92rem;
    min-width: 180px;
  }
  select.trip-select:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
  }
  button{
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    border: none;
  }
  .btn-primary{
    background: var(--gold);
    color: var(--navy-deep);
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.92rem;
    transition: background 0.15s ease;
  }
  .btn-primary:hover{ background: var(--gold-bright); }
  .btn-ghost{
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--line-on-navy);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.88rem;
  }
  .btn-ghost:hover{ border-color: var(--gold); color: var(--gold-bright); }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;
    padding: 80px 20px;
    color: rgba(244,239,225,0.7);
  }
  .empty h2{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 1.6rem;
    color: var(--cream);
    margin-bottom: 10px;
  }

  /* ---------- Boarding pass card ---------- */
  .pass{
    position: relative;
    background: var(--cream);
    color: var(--ink);
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 1fr 200px;
    overflow: hidden;
    margin-bottom: 30px;
  }
  .pass-main{
    padding: 28px 30px;
  }
  .pass-eyebrow{
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--rust);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .pass-dest{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 2rem;
    margin: 0 0 4px;
    line-height: 1.05;
  }
  .pass-dates{
    color: rgba(28,43,74,0.6);
    font-size: 0.9rem;
    margin-bottom: 22px;
  }
  .pass-budget-row{
    display:flex;
    justify-content: space-between;
    align-items:baseline;
    margin-bottom: 8px;
  }
  .pass-budget-label{ font-size: 0.82rem; color: rgba(28,43,74,0.65); }
  .pass-budget-amt{ font-family:'IBM Plex Mono', monospace; font-size: 0.95rem; font-weight:500;}
  .pass-bar-track{
    height: 8px;
    background: var(--cream-dim);
    border-radius: 5px;
    overflow: hidden;
  }
  .pass-bar-fill{
    height: 100%;
    border-radius: 5px;
    background: var(--sage);
    transition: width 0.4s ease;
  }
  .pass-bar-fill.over{ background: var(--rust); }
  .pass-remaining{
    margin-top: 10px;
    font-size: 0.85rem;
    color: rgba(28,43,74,0.65);
  }
  .pass-remaining strong{ color: var(--ink); }
  .pass-stub{
    background: var(--navy);
    color: var(--cream);
    padding: 28px 20px;
    display:flex;
    flex-direction: column;
    justify-content: center;
    align-items:center;
    text-align:center;
    position: relative;
    border-left: 2px dashed rgba(244,239,225,0.25);
  }
  .pass-stub::before, .pass-stub::after{
    content:"";
    position:absolute;
    width: 22px; height: 22px;
    background: var(--navy-deep);
    border-radius: 50%;
    left: -11px;
  }
  .pass-stub::before{ top: -11px; }
  .pass-stub::after{ bottom: -11px; }
  .pass-stub .big-num{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 2.1rem;
    line-height: 1;
  }
  .pass-stub .big-label{
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    color: rgba(244,239,225,0.6);
    margin-top: 8px;
  }
  @media (max-width: 620px){
    .pass{ grid-template-columns: 1fr; }
    .pass-stub{ border-left:none; border-top: 2px dashed rgba(244,239,225,0.25); flex-direction: row; gap: 12px; padding: 18px; }
    .pass-stub::before, .pass-stub::after{ left: 50%; margin-left:-11px; }
    .pass-stub::before{ top:-11px; }
    .pass-stub::after{ top:auto; bottom:-11px; }
  }

  /* ---------- Section headers ---------- */
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin: 0 0 14px;
  }
  .section-head h2{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 1.25rem;
    margin: 0;
  }

  /* ---------- Category chart ---------- */
  .chart-block{ margin-bottom: 30px; }
  .cat-row{
    display:grid;
    grid-template-columns: 110px 1fr 80px;
    align-items:center;
    gap: 12px;
    margin-bottom: 10px;
    font-size: 0.86rem;
  }
  .cat-name{ color: rgba(244,239,225,0.85); }
  .cat-track{
    height: 10px;
    background: rgba(244,239,225,0.1);
    border-radius: 6px;
    overflow:hidden;
  }
  .cat-fill{
    height:100%;
    border-radius:6px;
    transition: width 0.5s ease;
  }
  .cat-amt{
    font-family:'IBM Plex Mono', monospace;
    text-align:right;
    color: rgba(244,239,225,0.85);
  }
  .chart-empty{
    color: rgba(244,239,225,0.5);
    font-size: 0.88rem;
    padding: 10px 0;
  }

  /* ---------- Ledger ---------- */
  .ledger{ margin-bottom: 20px; }
  .ledger-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  .ledger-table thead th{
    text-align:left;
    font-weight: 500;
    color: rgba(244,239,225,0.5);
    font-size: 0.76rem;
    letter-spacing: 0.03em;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--line-on-navy);
  }
  .ledger-table td{
    padding: 12px 10px;
    border-bottom: 1px solid var(--line-on-navy);
    vertical-align: top;
  }
  .ledger-table tbody tr:hover{ background: rgba(244,239,225,0.04); }
  .ledger-amt{ font-family:'IBM Plex Mono', monospace; text-align:right; white-space:nowrap; }
  .cat-pill{
    display:inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 0.74rem;
    font-weight: 500;
    color: var(--navy-deep);
  }
  .ledger-note{ color: rgba(244,239,225,0.55); font-size: 0.84rem; }
  .row-actions{ text-align:right; }
  .icon-btn{
    background: none;
    color: rgba(244,239,225,0.4);
    font-size: 1rem;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .icon-btn:hover{ color: var(--rust); background: rgba(168,69,47,0.12); }
  .ledger-empty{
    text-align:center;
    padding: 40px 10px;
    color: rgba(244,239,225,0.5);
    font-size: 0.9rem;
  }
  .ledger-footer{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    margin-top: 16px;
  }
  select.trip-select option{ color: var(--ink); }

  /* ---------- Modal ---------- */
  .overlay{
    position: fixed; inset:0;
    background: rgba(14,24,48,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 40;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: var(--cream);
    color: var(--ink);
    border-radius: 14px;
    width: 100%;
    max-width: 440px;
    padding: 28px 26px;
    box-shadow: var(--shadow);
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h3{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 1.3rem;
    margin: 0 0 18px;
  }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 0.78rem;
    color: rgba(28,43,74,0.6);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea{
    width: 100%;
    padding: 9px 11px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.92rem;
    color: var(--ink);
  }
  .field-row{ display:flex; gap: 12px; }
  .field-row .field{ flex:1; }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  .btn-dark{
    background: var(--navy);
    color: var(--cream);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .btn-dark:hover{ background: var(--navy-deep); }
  .btn-text{
    background: none;
    color: rgba(28,43,74,0.55);
    padding: 10px 12px;
    font-size: 0.9rem;
  }
  .btn-text:hover{ color: var(--rust); }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy-deep);
    color: var(--cream);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 0.88rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 60;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); pointer-events:auto; }

  @media (max-width: 620px){
    .hero{ align-items:flex-start; }
    .ledger-table thead{ display:none; }
    .ledger-table, .ledger-table tbody, .ledger-table tr, .ledger-table td{ display:block; width:100%; }
    .ledger-table tr{ padding: 10px 0; border-bottom: 1px solid var(--line-on-navy); }
    .ledger-table td{ border:none; padding: 3px 0; }
    .ledger-amt{ text-align:left; font-size: 1rem; font-weight:600; }
    .row-actions{ text-align:left; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="hero">
    <div>
      <h1>Wayfare</h1>
      <p>A ledger for every trip — what it cost, where it went, and what's left.</p>
    </div>
    <div class="trip-picker" id="tripPicker"></div>
  </div>

  <div id="content"></div>

</div>

<div class="overlay" id="tripOverlay">
  <div class="modal">
    <h3 id="tripModalTitle">New trip</h3>
    <div class="field">
      <label for="tripName">Trip name</label>
      <input type="text" id="tripName" placeholder="e.g. Kyoto in autumn">
    </div>
    <div class="field">
      <label for="tripDest">Destination</label>
      <input type="text" id="tripDest" placeholder="e.g. Kyoto, Japan">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="tripStart">Start date</label>
        <input type="date" id="tripStart">
      </div>
      <div class="field">
        <label for="tripEnd">End date</label>
        <input type="date" id="tripEnd">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="tripBudget">Budget</label>
        <input type="number" id="tripBudget" placeholder="0" min="0" step="0.01">
      </div>
      <div class="field">
        <label for="tripCurrency">Currency</label>
        <select id="tripCurrency">
          <option value="$">USD — $</option>
          <option value="€">EUR — €</option>
          <option value="£">GBP — £</option>
          <option value="₹">INR — ₹</option>
          <option value="¥">JPY — ¥</option>
          <option value="A$">AUD — A$</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-text" id="tripCancel">Cancel</button>
      <button class="btn-dark" id="tripSave">Save trip</button>
    </div>
  </div>
</div>

<div class="overlay" id="expOverlay">
  <div class="modal">
    <h3>Add expense</h3>
    <div class="field-row">
      <div class="field">
        <label for="expDate">Date</label>
        <input type="date" id="expDate">
      </div>
      <div class="field">
        <label for="expCategory">Category</label>
        <select id="expCategory"></select>
      </div>
    </div>
    <div class="field">
      <label for="expAmount">Amount</label>
      <input type="number" id="expAmount" placeholder="0" min="0" step="0.01">
    </div>
    <div class="field">
      <label for="expNote">Note (optional)</label>
      <input type="text" id="expNote" placeholder="e.g. Train tickets to Arashiyama">
    </div>
    <div class="modal-actions">
      <button class="btn-text" id="expCancel">Cancel</button>
      <button class="btn-dark" id="expSave">Add expense</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const CATEGORIES = [
    { name: 'Flights',    color: '#C99A2E' },
    { name: 'Lodging',    color: '#6B8763' },
    { name: 'Food',       color: '#A8452F' },
    { name: 'Transport',  color: '#5C7A9E' },
    { name: 'Activities', color: '#8A6BA8' },
    { name: 'Shopping',   color: '#B5824A' },
    { name: 'Other',      color: '#8A8478' },
  ];
  const catColor = name => (CATEGORIES.find(c => c.name === name) || CATEGORIES[6]).color;

  let trips = [];
  let expenses = {}; // tripId -> array
  let selectedTripId = null;
  let editingTripId = null;
  let ledgerFilter = 'All';

  const $ = id => document.getElementById(id);

  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 2200);
  }

  function fmt(n){
    return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // ---------- storage ----------
  async function loadAll(){
    try{
      const list = await window.storage.list('trips:');
      const keys = (list && list.keys) || [];
      const loaded = [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k);
          if(r && r.value) loaded.push(JSON.parse(r.value));
        }catch(e){ /* skip unreadable */ }
      }
      loaded.sort((a,b)=> (a.startDate||'').localeCompare(b.startDate||''));
      trips = loaded;
    }catch(e){ trips = []; }

    for(const trip of trips){
      try{
        const r = await window.storage.get('expenses:' + trip.id);
        expenses[trip.id] = r && r.value ? JSON.parse(r.value) : [];
      }catch(e){ expenses[trip.id] = []; }
    }

    try{
      const sel = await window.storage.get('ui:selectedTrip');
      if(sel && sel.value && trips.some(t=>t.id===sel.value)) selectedTripId = sel.value;
    }catch(e){ /* no prior selection */ }

    if(!selectedTripId && trips.length) selectedTripId = trips[0].id;
  }

  async function saveTrip(trip){
    await window.storage.set('trips:' + trip.id, JSON.stringify(trip));
  }
  async function deleteTripStorage(id){
    await window.storage.delete('trips:' + id);
    await window.storage.delete('expenses:' + id);
  }
  async function saveExpenses(tripId){
    await window.storage.set('expenses:' + tripId, JSON.stringify(expenses[tripId] || []));
  }
  async function setSelected(id){
    selectedTripId = id;
    ledgerFilter = 'All';
    try{ await window.storage.set('ui:selectedTrip', id); }catch(e){}
    render();
  }

  // ---------- rendering ----------
  function renderTripPicker(){
    const el = $('tripPicker');
    el.innerHTML = '';
    if(trips.length){
      const sel = document.createElement('select');
      sel.className = 'trip-select';
      trips.forEach(t=>{
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.name;
        if(t.id === selectedTripId) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', e => setSelected(e.target.value));
      el.appendChild(sel);
    }
    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.textContent = '+ New trip';
    btn.addEventListener('click', () => openTripModal());
    el.appendChild(btn);
  }

  function currentTrip(){
    return trips.find(t => t.id === selectedTripId);
  }

  function render(){
    renderTripPicker();
    const content = $('content');
    const trip = currentTrip();

    if(!trip){
      content.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `<h2>No trips yet</h2><p>Start a trip to begin tracking what it costs.</p>`;
      const btn = document.createElement('button');
      btn.className = 'btn-primary';
      btn.style.marginTop = '16px';
      btn.textContent = '+ Plan a trip';
      btn.addEventListener('click', () => openTripModal());
      empty.appendChild(document.createElement('br'));
      empty.appendChild(btn);
      content.appendChild(empty);
      return;
    }

    const tripExpenses = (expenses[trip.id] || []).slice().sort((a,b)=> b.date.localeCompare(a.date));
    const spent = tripExpenses.reduce((s,e)=> s + Number(e.amount), 0);
    const budget = Number(trip.budget) || 0;
    const remaining = budget - spent;
    const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
    const over = budget > 0 && spent > budget;
    const days = daysBetween(trip.startDate, trip.endDate);
    const perDay = days > 0 ? spent / days : spent;

    content.innerHTML = '';
    content.appendChild(buildPass(trip, spent, budget, remaining, pct, over));
    content.appendChild(buildCategoryChart(trip, tripExpenses, spent));
    content.appendChild(buildStatsLine(days, perDay, trip.currency));
    content.appendChild(buildLedger(trip, tripExpenses));
  }

  function daysBetween(start, end){
    if(!start || !end) return 0;
    const a = new Date(start), b = new Date(end);
    const diff = Math.round((b - a) / 86400000) + 1;
    return diff > 0 ? diff : 0;
  }

  function buildPass(trip, spent, budget, remaining, pct, over){
    const wrap = document.createElement('div');
    wrap.className = 'pass';

    const main = document.createElement('div');
    main.className = 'pass-main';
    const eyebrow = document.createElement('div');
    eyebrow.className = 'pass-eyebrow';
    eyebrow.textContent = trip.name;
    const dest = document.createElement('div');
    dest.className = 'pass-dest';
    dest.textContent = trip.destination || 'Destination TBD';
    const dates = document.createElement('div');
    dates.className = 'pass-dates';
    dates.textContent = formatRange(trip.startDate, trip.endDate);

    const budgetRow = document.createElement('div');
    budgetRow.className = 'pass-budget-row';
    budgetRow.innerHTML = `<span class="pass-budget-label">Spent of budget</span>
      <span class="pass-budget-amt">${trip.currency}${fmt(spent)} ${budget>0 ? '/ ' + trip.currency + fmt(budget) : ''}</span>`;

    const track = document.createElement('div');
    track.className = 'pass-bar-track';
    const fill = document.createElement('div');
    fill.className = 'pass-bar-fill' + (over ? ' over' : '');
    fill.style.width = (budget > 0 ? pct : (spent>0?100:0)) + '%';
    track.appendChild(fill);

    const remainingEl = document.createElement('div');
    remainingEl.className = 'pass-remaining';
    if(budget > 0){
      remainingEl.innerHTML = over
        ? `<strong>${trip.currency}${fmt(Math.abs(remaining))}</strong> over budget`
        : `<strong>${trip.currency}${fmt(remaining)}</strong> remaining`;
    } else {
      remainingEl.textContent = 'No budget set for this trip';
    }

    main.appendChild(eyebrow);
    main.appendChild(dest);
    main.appendChild(dates);
    main.appendChild(budgetRow);
    main.appendChild(track);
    main.appendChild(remainingEl);

    const editRow = document.createElement('div');
    editRow.style.marginTop = '16px';
    editRow.style.display = 'flex';
    editRow.style.gap = '8px';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-ghost';
    editBtn.style.color = 'var(--ink)';
    editBtn.style.borderColor = 'var(--line)';
    editBtn.textContent = 'Edit trip';
    editBtn.addEventListener('click', () => openTripModal(trip));
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-ghost';
    delBtn.style.color = 'var(--rust)';
    delBtn.style.borderColor = 'var(--line)';
    delBtn.textContent = 'Delete trip';
    delBtn.addEventListener('click', () => confirmDeleteTrip(trip));
    editRow.appendChild(editBtn);
    editRow.appendChild(delBtn);
    main.appendChild(editRow);

    const stub = document.createElement('div');
    stub.className = 'pass-stub';
    stub.innerHTML = `<div class="big-num">${tripExpenseCount(trip.id)}</div><div class="big-label">EXPENSES LOGGED</div>`;

    wrap.appendChild(main);
    wrap.appendChild(stub);
    return wrap;
  }

  function tripExpenseCount(id){ return (expenses[id] || []).length; }

  function formatRange(start, end){
    if(!start && !end) return 'Dates not set';
    const opts = { month: 'short', day: 'numeric', year: 'numeric' };
    const s = start ? new Date(start + 'T00:00:00').toLocaleDateString(undefined, opts) : '?';
    const e = end ? new Date(end + 'T00:00:00').toLocaleDateString(undefined, opts) : '?';
    return `${s} — ${e}`;
  }

  function buildCategoryChart(trip, tripExpenses, spent){
    const wrap = document.createElement('div');
    wrap.className = 'chart-block';
    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<h2>By category</h2>`;
    wrap.appendChild(head);

    if(!tripExpenses.length){
      const e = document.createElement('div');
      e.className = 'chart-empty';
      e.textContent = 'Add an expense to see the breakdown.';
      wrap.appendChild(e);
      return wrap;
    }

    const totals = {};
    tripExpenses.forEach(e => { totals[e.category] = (totals[e.category] || 0) + Number(e.amount); });
    const maxVal = Math.max(...Object.values(totals));

    Object.entries(totals)
      .sort((a,b)=> b[1]-a[1])
      .forEach(([cat, amt])=>{
        const row = document.createElement('div');
        row.className = 'cat-row';
        const name = document.createElement('div');
        name.className = 'cat-name';
        name.textContent = cat;
        const track = document.createElement('div');
        track.className = 'cat-track';
        const fill = document.createElement('div');
        fill.className = 'cat-fill';
        fill.style.width = ((amt / maxVal) * 100) + '%';
        fill.style.background = catColor(cat);
        track.appendChild(fill);
        const amtEl = document.createElement('div');
        amtEl.className = 'cat-amt';
        amtEl.textContent = trip.currency + fmt(amt);
        row.appendChild(name);
        row.appendChild(track);
        row.appendChild(amtEl);
        wrap.appendChild(row);
      });

    return wrap;
  }

  function buildStatsLine(days, perDay, currency){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'color:rgba(244,239,225,0.55); font-size:0.85rem; margin: -14px 0 28px;';
    if(days > 0){
      wrap.textContent = `${days} day trip · averaging ${currency}${fmt(perDay)} per day`;
    } else {
      wrap.textContent = `Averaging ${currency}${fmt(perDay)} so far`;
    }
    return wrap;
  }

  function buildLedger(trip, tripExpenses){
    const wrap = document.createElement('div');
    wrap.className = 'ledger';
    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<h2>Expenses</h2>`;

    const headRight = document.createElement('div');
    headRight.style.cssText = 'display:flex; gap:10px; align-items:center;';

    if(tripExpenses.length){
      const filterSel = document.createElement('select');
      filterSel.className = 'trip-select';
      filterSel.style.cssText = 'min-width:0; padding:9px 12px; font-size:0.85rem;';
      const allOpt = document.createElement('option');
      allOpt.value = 'All';
      allOpt.textContent = 'All categories';
      filterSel.appendChild(allOpt);
      CATEGORIES.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name;
        filterSel.appendChild(opt);
      });
      filterSel.value = ledgerFilter;
      filterSel.addEventListener('change', e => { ledgerFilter = e.target.value; render(); });
      headRight.appendChild(filterSel);
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'btn-primary';
    addBtn.textContent = '+ Add expense';
    addBtn.addEventListener('click', () => openExpenseModal(trip));
    headRight.appendChild(addBtn);
    head.appendChild(headRight);
    wrap.appendChild(head);

    if(!tripExpenses.length){
      const e = document.createElement('div');
      e.className = 'ledger-empty';
      e.textContent = 'No expenses logged for this trip yet.';
      wrap.appendChild(e);
      return wrap;
    }

    const visible = ledgerFilter === 'All' ? tripExpenses : tripExpenses.filter(e => e.category === ledgerFilter);

    const table = document.createElement('table');
    table.className = 'ledger-table';
    table.innerHTML = `<thead><tr>
        <th>Date</th><th>Category</th><th>Note</th><th style="text-align:right">Amount</th><th></th>
      </tr></thead>`;
    const tbody = document.createElement('tbody');
    if(!visible.length){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="5" class="ledger-empty">No expenses in this category yet.</td>`;
      tbody.appendChild(tr);
    }
    visible.forEach(exp => {
      const tr = document.createElement('tr');
      const dateStr = exp.date ? new Date(exp.date + 'T00:00:00').toLocaleDateString(undefined, {month:'short', day:'numeric'}) : '—';
      tr.innerHTML = `
        <td>${dateStr}</td>
        <td><span class="cat-pill" style="background:${catColor(exp.category)}">${exp.category}</span></td>
        <td class="ledger-note">${exp.note ? escapeHtml(exp.note) : '—'}</td>
        <td class="ledger-amt">${trip.currency}${fmt(exp.amount)}</td>
        <td class="row-actions"></td>
      `;
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.textContent = '✕';
      delBtn.title = 'Delete expense';
      delBtn.addEventListener('click', () => deleteExpense(trip.id, exp.id));
      tr.querySelector('.row-actions').appendChild(delBtn);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);

    const footer = document.createElement('div');
    footer.className = 'ledger-footer';
    const exportCsvBtn = document.createElement('button');
    exportCsvBtn.className = 'btn-ghost';
    exportCsvBtn.textContent = 'Export CSV';
    exportCsvBtn.addEventListener('click', () => exportCsv(trip, tripExpenses));
    const exportXlsxBtn = document.createElement('button');
    exportXlsxBtn.className = 'btn-ghost';
    exportXlsxBtn.textContent = 'Download Excel';
    exportXlsxBtn.addEventListener('click', () => exportExcel(trip, tripExpenses));
    footer.appendChild(exportCsvBtn);
    footer.appendChild(exportXlsxBtn);
    wrap.appendChild(footer);

    return wrap;
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function exportCsv(trip, tripExpenses){
    const rows = [['Date','Category','Note','Amount']];
    tripExpenses.forEach(e => rows.push([e.date, e.category, (e.note||'').replace(/,/g,';'), e.amount]));
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = trip.name.replace(/[^a-z0-9]+/gi,'_') + '_expenses.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function categoryTotals(tripExpenses){
    const totals = {};
    tripExpenses.forEach(e => { totals[e.category] = (totals[e.category] || 0) + Number(e.amount); });
    return Object.entries(totals).sort((a,b)=> b[1]-a[1]);
  }

  function exportExcel(trip, tripExpenses){
    if(typeof XLSX === 'undefined'){ toast("Excel export didn't load — try again"); return; }

    const wb = XLSX.utils.book_new();

    // Sheet 1: category-wise summary
    const totals = categoryTotals(tripExpenses);
    const grandTotal = totals.reduce((s,[,amt])=> s+amt, 0);
    const summaryRows = [
      ['Trip', trip.name],
      ['Destination', trip.destination || ''],
      ['Dates', formatRange(trip.startDate, trip.endDate)],
      ['Currency', trip.currency],
      ['Budget', trip.budget || 0],
      [],
      ['Category', 'Total', 'Share of spend'],
      ...totals.map(([cat, amt]) => [cat, Number(amt.toFixed(2)), grandTotal ? (amt/grandTotal) : 0]),
      [],
      ['Total spent', Number(grandTotal.toFixed(2)), ''],
    ];
    const summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
    summarySheet['!cols'] = [{wch:18},{wch:16},{wch:14}];
    XLSX.utils.book_append_sheet(wb, summarySheet, 'By category');

    // Sheet 2: full expense detail, grouped so category-wise rows sit together
    const sorted = tripExpenses.slice().sort((a,b)=>
      a.category.localeCompare(b.category) || a.date.localeCompare(b.date)
    );
    const detailRows = [['Category','Date','Note','Amount']];
    sorted.forEach(e => detailRows.push([e.category, e.date, e.note || '', Number(Number(e.amount).toFixed(2))]));
    const detailSheet = XLSX.utils.aoa_to_sheet(detailRows);
    detailSheet['!cols'] = [{wch:14},{wch:12},{wch:36},{wch:12}];
    XLSX.utils.book_append_sheet(wb, detailSheet, 'Expenses');

    XLSX.writeFile(wb, trip.name.replace(/[^a-z0-9]+/gi,'_') + '_expenses.xlsx');
  }

  // ---------- trip modal ----------
  function openTripModal(trip){
    editingTripId = trip ? trip.id : null;
    $('tripModalTitle').textContent = trip ? 'Edit trip' : 'New trip';
    $('tripName').value = trip ? trip.name : '';
    $('tripDest').value = trip ? trip.destination : '';
    $('tripStart').value = trip ? trip.startDate : '';
    $('tripEnd').value = trip ? trip.endDate : '';
    $('tripBudget').value = trip ? trip.budget : '';
    $('tripCurrency').value = trip ? trip.currency : '$';
    $('tripOverlay').classList.add('open');
    $('tripName').focus();
  }
  function closeTripModal(){ $('tripOverlay').classList.remove('open'); }

  async function saveTripFromModal(){
    const name = $('tripName').value.trim();
    if(!name){ toast('Give the trip a name first'); return; }
    const trip = {
      id: editingTripId || ('trip_' + Date.now()),
      name,
      destination: $('tripDest').value.trim(),
      startDate: $('tripStart').value,
      endDate: $('tripEnd').value,
      budget: parseFloat($('tripBudget').value) || 0,
      currency: $('tripCurrency').value,
    };
    await saveTrip(trip);
    if(editingTripId){
      trips = trips.map(t => t.id === trip.id ? trip : t);
    } else {
      trips.push(trip);
      expenses[trip.id] = [];
    }
    trips.sort((a,b)=> (a.startDate||'').localeCompare(b.startDate||''));
    closeTripModal();
    await setSelected(trip.id);
    toast(editingTripId ? 'Trip updated' : 'Trip created');
  }

  async function confirmDeleteTrip(trip){
    if(!confirm(`Delete "${trip.name}" and all its expenses? This can't be undone.`)) return;
    await deleteTripStorage(trip.id);
    trips = trips.filter(t => t.id !== trip.id);
    delete expenses[trip.id];
    selectedTripId = trips.length ? trips[0].id : null;
    try{ await window.storage.set('ui:selectedTrip', selectedTripId || ''); }catch(e){}
    render();
    toast('Trip deleted');
  }

  // ---------- expense modal ----------
  function openExpenseModal(trip){
    const catSel = $('expCategory');
    catSel.innerHTML = '';
    CATEGORIES.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name;
      catSel.appendChild(opt);
    });
    $('expDate').value = new Date().toISOString().slice(0,10);
    $('expAmount').value = '';
    $('expNote').value = '';
    $('expOverlay').classList.add('open');
    $('expOverlay').dataset.tripId = trip.id;
    $('expAmount').focus();
  }
  function closeExpenseModal(){ $('expOverlay').classList.remove('open'); }

  async function saveExpenseFromModal(){
    const tripId = $('expOverlay').dataset.tripId;
    const amount = parseFloat($('expAmount').value);
    if(!amount || amount <= 0){ toast('Enter an amount first'); return; }
    const exp = {
      id: 'exp_' + Date.now(),
      date: $('expDate').value || new Date().toISOString().slice(0,10),
      category: $('expCategory').value,
      amount,
      note: $('expNote').value.trim(),
    };
    expenses[tripId] = expenses[tripId] || [];
    expenses[tripId].push(exp);
    await saveExpenses(tripId);
    closeExpenseModal();
    render();
    toast('Expense added');
  }

  async function deleteExpense(tripId, expId){
    expenses[tripId] = (expenses[tripId] || []).filter(e => e.id !== expId);
    await saveExpenses(tripId);
    render();
    toast('Expense removed');
  }

  // ---------- wire up ----------
  $('tripCancel').addEventListener('click', closeTripModal);
  $('tripSave').addEventListener('click', saveTripFromModal);
  $('tripOverlay').addEventListener('click', e => { if(e.target.id === 'tripOverlay') closeTripModal(); });

  $('expCancel').addEventListener('click', closeExpenseModal);
  $('expSave').addEventListener('click', saveExpenseFromModal);
  $('expOverlay').addEventListener('click', e => { if(e.target.id === 'expOverlay') closeExpenseModal(); });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ closeTripModal(); closeExpenseModal(); }
  });

  // ---------- init ----------
  (async function init(){
    $('content').innerHTML = '<div class="empty"><h2>Loading your trips…</h2></div>';
    await loadAll();
    render();
  })();
})();
</script>
</body>
</html>
